{% extends 'career/base.html' %}
{% block title %}Delete University | Consilium  -  Smart Career Advisor{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>Delete University</h2>
  <p>Are you sure you want to delete <strong>{{ uni.name }}</strong> ({{ uni.city }})? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'manage_universities' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
